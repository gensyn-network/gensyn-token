[profile.default]
src = "src"
out = "out"
libs = ["lib"]
solc = "0.8.30"
show_progress = true

[fuzz]
runs = 256
show_logs = false

[invariant]
runs = 256
depth = 15
fail_on_revert = true
show_metrics = true

[rpc_endpoints]
ethereum-sepolia = "https://eth-sepolia.g.alchemy.com/v2/${ALCHEMY_API_KEY}"
gensyn-testnet = "https://gensyn-testnet.g.alchemy.com/v2/${ALCHEMY_API_KEY}"
ethereum-mainnet = "https://eth-mainnet.g.alchemy.com/v2/${ALCHEMY_API_KEY}"
gensyn-mainnet = "https://gensyn-mainnet.g.alchemy.com/v2/${ALCHEMY_API_KEY}"
base-mainnet = "https://base-mainnet.g.alchemy.com/v2/${ALCHEMY_API_KEY}"

# See more config options https://github.com/foundry-rs/foundry/blob/master/crates/config/README.md#all-options
